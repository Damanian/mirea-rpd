[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mirea-rpd"
version = "0.1.0"
description = "MCP-сервер и Python API для работы с рабочими программами дисциплин (РПД) РТУ МИРЭА (rpd.mirea.ru)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Damanian" }]
dependencies = [
    "httpx>=0.25",
    "beautifulsoup4>=4.12",
    "mcp>=2.3,<3",
    "pydantic>=2.0",
    "uvicorn>=0.30",
    "starlette>=0.37",
    "python-multipart>=0.0.9",
    "python-docx>=1.1",
    "lxml>=5.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.23",
    "respx>=0.20",
    "ruff>=0.5",
]

[project.scripts]
mirea-rpd = "mirea_rpd.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mirea_rpd"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
